    #box { width: 92%; max-width: 850px; margin: 20px 0; padding: 25px; background: var(--card); border: 2px solid var(--n); border-radius: 24px; display: grid; grid-template-columns: 120px 1fr 1fr; gap: 20px; backdrop-filter: blur(15px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

    .sym-box { width: 110px; height: 110px; border: 3px solid var(--n); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; box-shadow: 0 0 20px rgba(0,242,255,0.3); }
    .sym-box span { font-size: 40px; font-weight: bold; color: var(--n); }
    .sym-box small { font-size: 12px; color: #94a3b8; }

    .main-info h3 { margin: 0; font-size: 28px; color: var(--n); border-bottom: 1px solid rgba(0,242,255,0.2); padding-bottom: 5px; }
    .main-info p { margin: 10px 0; font-size: 15px; line-height: 1.6; }
    .stats { display: flex; flex-direction: column; justify-content: center; gap: 8px; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 20px; }
    .stat-item { font-size: 13px; color: #cbd5e1; }
    .stat-item b { color: #fff; font-size: 15px; }

    .fact-tag { background: #0ea5e9; color: #000; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block; margin-top: 10px; }

function show(e,idx,color){
    document.querySelectorAll('.e').forEach(el=>{
        el.classList.add('dim'); el.classList.remove('active');
    });
    document.querySelectorAll('.c'+idx).forEach(el=>{
        el.classList.remove('dim'); el.classList.add('active');
    });
    document.getElementById('det-num').innerText = e[0];
    document.getElementById('det-sym').innerText = e[1];
    document.getElementById('det-mass').innerText = e[6]; // Mass
    document.getElementById('det-mass2').innerText = e[6] + ' u';
    document.getElementById('det-name').innerText = e[2];
    document.getElementById('det-name-fa').innerText = e[2];
    document.getElementById('det-group').innerText = G[idx];
    document.getElementById('det-fact').innerText = e[7]; // Fact
    document.getElementById('box').style.borderColor = color;
}
