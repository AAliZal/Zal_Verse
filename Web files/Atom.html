<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>شبیه‌ساز اتم سه‌بعدی پیشرفته</title>
    <style>
        body { background: #000; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: Tahoma; color: white; perspective: 1200px; }
        .instructions { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; pointer-events: none; border: 1px solid rgba(0, 210, 255, 0.3); backdrop-filter: blur(5px); z-index: 10; }

        #zoom-layer { transform-style: preserve-3d; transition: transform 0.1s ease-out; }
        #scene { position: relative; width: 0; height: 0; transform-style: preserve-3d; transform: rotateX(-20deg) rotateY(20deg); }

        .nucleus { position: absolute; transform-style: preserve-3d; width: 40px; height: 40px; top: -20px; left: -20px; animation: nucleusPulse 2s infinite ease-in-out; }
        @keyframes nucleusPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        .particle { position: absolute; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset -4px -4px 8px rgba(0,0,0,0.8); }
        .proton { background: radial-gradient(circle at 30% 30%, #ff3e3e, #600); box-shadow: 0 0 20px rgba(255, 62, 62, 0.5); }
        .neutron { background: radial-gradient(circle at 30% 30%, #95a5a6, #2c3e50); box-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }

        .orbit { position: absolute; border: 1.5px solid rgba(0, 210, 255, 0.2); border-radius: 50%; transform-style: preserve-3d; top: 50%; left: 50%; }
        .electron { position: absolute; width: 12px; height: 12px; background: #00d2ff; border-radius: 50%; box-shadow: 0 0 20px #00d2ff, 0 0 40px rgba(0, 210, 255, 0.5); top: -6px; left: -6px; }
        .electron-holder { position: absolute; width: 100%; height: 100%; top: 0; left: 0; animation: rotate linear infinite; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .bg-glow { position: absolute; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #001a33 0%, #000 70%); z-index: -1; }
    .home-btn{
    position:fixed;
    top:15px;
    right:0;
    z-index:9999;

    padding:12px 25px;
    background:linear-gradient(135deg,#00d2ff,#0066ff);
    color:white;
    text-decoration:none;
    font-weight:bold;
    border-radius:15px 0 0 15px;

    box-shadow:0 0 15px rgba(0,210,255,.5);
    transition:.3s;
}

.home-btn:hover{
    padding-left:35px;
    box-shadow:0 0 25px rgba(0,210,255,.9);
}
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="instructions">
        🖱️ <b>درگ:</b> چرخش ۳‌بعدی اتم <br>
        🎡 <b>اسکرول:</b> زوم نرم (Smooth Zoom)
    </div>

    <div id="zoom-layer">
        <div id="scene">
            <!-- هسته -->
            <div class="nucleus">
                <div class="particle proton" style="transform: translate3d(8px, 0, 8px);"></div>
                <div class="particle neutron" style="transform: translate3d(-12px, 6px, 0);"></div>
                <div class="particle proton" style="transform: translate3d(0, -12px, -8px);"></div>
                <div class="particle neutron" style="transform: translate3d(10px, 10px, -10px);"></div>

                <div class="particle proton" style="transform: translate3d(-8px, -8px, 12px);"></div>
            </div>

            <!-- مدار ۱ -->
            <div class="orbit" style="width: 180px; height: 180px; margin-left: -90px; margin-top: -90px; transform: rotateX(90deg);">
                <div class="electron-holder" style="animation-duration: 3s;">
                    <div class="electron" style="margin-left: 90px;"></div>
                </div>
            </div>

            <!-- مدار ۲ -->
            <div class="orbit" style="width: 320px; height: 320px; margin-left: -160px; margin-top: -160px; transform: rotateY(90deg);">
                <div class="electron-holder" style="animation-duration: 5s;">
                    <div class="electron" style="margin-left: 160px;"></div>
                </div>
            </div>

            <!-- مدار ۳ -->
            <div class="orbit" style="width: 460px; height: 460px; margin-left: -230px; margin-top: -230px; transform: rotateX(45deg) rotateY(30deg);">
                <div class="electron-holder" style="animation-duration: 7s;">
                    <div class="electron" style="margin-left: 230px;"></div>
                </div>
            </div>
        </div>
    </div>
<div style="text-align:center;margin-top:15px;">
    <a href="../index.html" class="home-btn">
        بازگشت به صفحه اصلی
    </a>
</div>
    <script>
        const scene = document.getElementById('scene');
        const zoomLayer = document.getElementById('zoom-layer');

        let isDragging = false;
        let lastX, lastY;
        let rotX = -20, rotY = 20;
        let currentScale = 1;

        // چرخش با درگ (ماوس)
        document.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', e => {
            if (!isDragging) return;
            rotY += (e.clientX - lastX) * 0.5;
            rotX -= (e.clientY - lastY)*  0.5;
            scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            lastX = e.clientX; lastY = e.clientY;
        });

        // چرخش با لمس (گوشی)
        document.addEventListener('touchstart', e => {
            if (e.touches.length !== 1) return;
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', () => { isDragging = false; });
        document.addEventListener('touchcancel', () => { isDragging = false; });

        document.addEventListener('touchmove', e => {
            if (!isDragging || e.touches.length !== 1) return;
            e.preventDefault();
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            rotY += (touchX - lastX) * 0.5;
            rotX -= (touchY - lastY) * 0.5;
            scene.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            lastX = touchX; lastY = touchY;
        }, { passive: false });

        // زوم اصلاح شده (تصاعدی) - با چرخ ماوس
        document.addEventListener('wheel', e => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            currentScale = delta;

            // محدودیت زوم برای جلوگیری از غیب شدن
            currentScale = Math.min(Math.max(0.1, currentScale), 5);
            zoomLayer.style.transform = `scale(${currentScale})`;
        }, { passive: false });

        // زوم با پینچ دو انگشتی (گوشی)
        let pinchStartDist = null;
        let pinchStartScale = 1;

        function touchDist(t){
            const dx = t[0].clientX - t[1].clientX;
            const dy = t[0].clientY - t[1].clientY;
            return Math.hypot(dx, dy);
        }

        document.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                isDragging = false;
                pinchStartDist = touchDist(e.touches);
                pinchStartScale = currentScale;
            }
        }, { passive: true });

        document.addEventListener('touchmove', e => {
            if (e.touches.length === 2 && pinchStartDist) {
                e.preventDefault();
                const newDist = touchDist(e.touches);
                let scale = pinchStartScale * (newDist / pinchStartDist);
                scale = Math.min(Math.max(0.1, scale), 5);
                currentScale = scale;
                zoomLayer.style.transform = `scale(${currentScale})`;
            }
        }, { passive: false });

        document.addEventListener('touchend', e => {
            if (e.touches.length < 2) pinchStartDist = null;
        });
    </script>
<script src="MusicPlayer.js"></script>
</body>
</html>
