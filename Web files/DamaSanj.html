<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reactor Simulator</title>

<style>

body{
    margin:0;
    overflow:hidden;
    height:100vh;
    display:flex;
    background:#050505;
    color:white;
    font-family:tahoma;
}


.dashboard{
    width:320px;
    background:#111;
    padding:20px;
    box-sizing:border-box;
    border-left:2px solid #333;
    z-index:100;
}

.data-box{
    background:#000;
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    border:1px solid #333;
}

.num{
    color:#00ffe1;
    font-size:22px;
    font-family:monospace;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    background:#222;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#444;
}

input[type=range]{
    width:100%;
}


.lab{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}


.thermo{
    width:140px;
    height:500px;
    background:linear-gradient(#3b2a1d,#111);
    border-radius:15px;
    position:relative;
    box-shadow:0 0 40px black;
}


.glass{
    position:absolute;
    width:20px;
    height:380px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);
    left:50%;
    transform:translateX(-50%);
    top:40px;
    border-radius:20px;
    overflow:hidden;
}


.mercury{
    position:absolute;
    bottom:0;
    width:100%;
    height:10%;
    background:linear-gradient(red,#ff7777);
    box-shadow:0 0 20px red;
    transition:height .2s;
}


.core{
    width:60px;
    height:60px;
    background:radial-gradient(circle,#ff5555,#300);
    border-radius:50%;
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
}


.shaking{
    animation:shake .05s infinite;
}

@keyframes shake{
    0%{transform:translate(1px,1px);}
    100%{transform:translate(-1px,-1px);}
}


.shard{
    position:absolute;
    background:white;
    width:10px;
    height:10px;
    clip-path:polygon(50% 0%,0% 100%,100% 100%);
}


.smoke{
    position:absolute;
    width:80px;
    height:80px;
    background:rgba(120,120,120,.2);
    border-radius:50%;
    filter:blur(20px);
}


#flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
}
.home-btn{
    position:fixed;
    top:15px;
    left:0;
    z-index:9999;

    padding:12px 25px;
    background:linear-gradient(135deg,#00d2ff,#0066ff);
    color:white;
    text-decoration:none;
    font-weight:bold;
    border-radius:0 15px 15px 0;

    box-shadow:0 0 15px rgba(0,210,255,.5);
    transition:.3s;
}

.home-btn:hover{
    padding-right:35px;
    box-shadow:0 0 25px rgba(0,210,255,.9);
}
</style>
</head>

<body>

<div id="flash"></div>

<!-- داشبورد -->

<div class="dashboard">

<h2>☢️ کنترل دماسنج</h2>

<div class="data-box">
دما:
<br>
<span class="num" id="tempText">25°C</span>
</div>

<div class="data-box">
فشار:
<br>
<span class="num" id="pressureText">1 atm</span>
</div>

<div class="data-box">
تشعشع:
<br>
<span class="num" id="radText">0 mSv</span>
</div>

<input type="range"
id="slider"
min="0"
max="250"
value="25">

<p id="status">
وضعیت: ایمن
</p>

<button id="coolBtn">
فعال‌سازی خنک‌کننده
</button>

<button onclick="location.reload()">
ریست
</button>

</div>

<!-- محیط -->

<div class="lab">

<div class="thermo"
id="thermo">

<div class="glass">

<div class="mercury"
id="mercury"></div>

</div>

<div class="core"></div>

</div>

<div id="fx"></div>

</div>
<div style="text-align:center;margin-top:15px;">
    <a href="../index.html" class="home-btn">
        بازگشت به صفحه اصلی
    </a>
</div>
<script>

var slider =
document.getElementById("slider");

var mercury =
document.getElementById("mercury");

var tempText =
document.getElementById("tempText");

var pressureText =
document.getElementById("pressureText");

var radText =
document.getElementById("radText");

var statusText =
document.getElementById("status");

var thermo =
document.getElementById("thermo");

var flash =
document.getElementById("flash");

var fx =
document.getElementById("fx");

var coolBtn =
document.getElementById("coolBtn");

var exploded = false;
var cooling = false;
var radiation = 0;

/ خنک‌کننده */

coolBtn.onclick = function(){

    cooling = !cooling;

    if(cooling){

        coolBtn.innerHTML =
        "خاموش کردن خنک‌کننده";

    }else{

        coolBtn.innerHTML =
        "فعال‌سازی خنک‌کننده";
    }
};


setInterval(function(){

    if(cooling && !exploded){

        var t =
        parseInt(slider.value);

        if(t > 0){

            t--;

            slider.value = t;

            updateReactor();
        }
    }

},50);

/ تغییر دما /

slider.oninput =
updateReactor;

function updateReactor(){

    if(exploded) return;

    var val =
    parseInt(slider.value);

    tempText.innerHTML =
    val + "°C";

    mercury.style.height =
    (val/2) + "%";

    pressureText.innerHTML =
    (1 + val/80).toFixed(2)
    + " atm";

    document.body.style.background =
    "rgb(" + (val/2) + ",0,0)";

    / هشدار /

    if(val >= 150){

        thermo.classList.add(
        "shaking");

        statusText.innerHTML =
        "⚠️ فشار بحرانی";

        statusText.style.color =
        "orange";

        beep();

    }else{

        thermo.classList.remove(
        "shaking");

        statusText.innerHTML =
        "وضعیت: ایمن";

        statusText.style.color =
        "#d4af37";
    }

    / انفجار /

    if(val >= 200){

        explode();
    }

}

/ صدای هشدار /

function beep(){

    try{

        var ctx =
        new(window.AudioContext ||
        window.webkitAudioContext)();

        var osc =
        ctx.createOscillator();

        osc.connect(ctx.destination);

        osc.frequency.value = 600;

        osc.start();

        osc.stop(ctx.currentTime + 0.05);

    }catch(e){}
}

/ انفجار /

function explode(){

    exploded = true;

    statusText.innerHTML =
    "☢️ انفجار دماسنج";

    statusText.style.color =
    "red";

    flash.style.opacity = 1;

    setTimeout(function(){

        flash.style.opacity = 0;

    },150);

    / تشعشع /

    setInterval(function(){

        radiation += 5;

        radText.innerHTML =
        radiation + " mSv";

    },500);

    / دود */

    for(var i=0;i<20;i++){

        var smoke =
        document.createElement("div");

        smoke.className =
        "smoke";

        smoke.style.left =
        "50%";

        smoke.style.top =
        "40%";

        fx.appendChild(smoke);

        smoke.animate([

            {
                transform:
                "translate(0,0) scale(.5)",
                opacity:.8
            },

            {
                transform:
                "translate("
                + ((Math.random()-0.5)*300)
                + "px,-500px) scale(3)",

                opacity:0
            }

        ],{

            duration:4000,
            fill:"forwards"

        });
    }

    /* خرده شیشه */

    for(var j=0;j<25;j++){

        var shard =
        document.createElement("div");

        shard.className =
        "shard";

        shard.style.left =
        "50%";

        shard.style.top =
        "40%";

        fx.appendChild(shard);

        shard.animate([

            {
                transform:
                "translate(0,0)",
                opacity:1
            },

            {
                transform:
                "translate("
                + ((Math.random()-0.5)*700)
                + "px,"
                + ((Math.random()-0.5)*700)
                + "px)",

                opacity:0
            }

        ],{

            duration:1200,
            fill:"forwards"

        });
    }

}

</script>

<script src="MusicPlayer.js"></script>
</body>
</html>
